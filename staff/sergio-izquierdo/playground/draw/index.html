<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw</title>

  </head>
  <body class="bg-black">
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.js"></script>

    <script src="main.jsx" type="text/babel"></script>


    <div
      class="w-200 h-50 bg-red-600 absolute left-250 top-100 rounded-tl-[100px] rounded-tr-[100px]"
    >
      <div
        class="w-100 h-20 bg-blue-500 rounded-tl-[80px] rounded-tr-[80px] absolute left-50 -top-20"

      <div class="w-40 h-40 bg-[gray] rounded-full absolute top-30 left-20">

        ></div>
      </div>
      <div class="w-40 h-40 bg-[gray] rounded-full absolute top-30 right-20">
        <div
          class="w-30 h-30 bg-black rounded-full absolute left-5 top-5"
        ></div>
        <div
          class="w-3 h-50 bg-[darkslategray] absolute right-80 bottom-20"
        ></div>
      </div>
    </div>

    <div
      class="w-50 h-200 bg-[gray] absolute left-100 top-300 rounded-tl-[50%] rounded-tr-[50%]"

        class="w-30 h-20 bg-blue-800 absolute top-25 left-10 rounded-t-[50%] rounded-tr-[50%]"

      <div
        class="w-15 h-15 bg-blue-800 absolute left-17 rounded-full top-100"
      ></div>
      <div
        class="w-15 h-15 bg-blue-800 absolute left-17 rounded-full top-125"
      ></div>
      <div
        class="w-50 h-50 bg-transparent absolute -left-[14rem] bottom-0 border-b-[20rem] border-b-[gray] border-l-[20rem] border-l-transparent border-r-[20rem] border-r-transparent -z-10"
      ></div>
      <div
        class="w-50 h-100 bg-gradient-to-b from-red-500 via-[orange] to-[yellow] absolute -bottom-100 rounded-b-[50%] -z-10"
      ></div>
    </div>

    <div class="w-200 h-300 bg-[burlywood] absolute bottom-30 left-400">
      <div class="w-200 h-75 bg-[aqua] absolute top-15">
        <div class="w-3 h-75 bg-[rgb(207,203,203)] absolute left-66.5"></div>
        <div class="w-3 h-75 bg-[rgb(207,203,203)] absolute left-133"></div>
        <div class="w-200 h-3 bg-[rgb(207,203,203)] absolute top-37.5"></div>
      </div>
      <div class="w-50 h-50 bg-[aqua] absolute top-100 left-10">

        <div class="w-50 h-3 bg-[rgb(207,203,203)] absolute top-23.5"></div>
      </div>
      <div class="w-50 h-50 bg-[aqua] absolute top-100 left-75">

        <div class="w-50 h-3 bg-[rgb(207,203,203)] absolute top-23.5"></div>
      </div>
      <div class="w-50 h-50 bg-[aqua] absolute top-100 right-10">
        <div class="w-3 h-50 bg-[rgb(207,203,203)] absolute left-23.5"></div>
        <div class="w-50 h-3 bg-[rgb(207,203,203)] absolute top-23.5"></div>
      </div>
      <div
        class="w-100 h-120 bg-[brown] absolute bottom-0 right-50 rounded-tl-[50%] rounded-tr-[50%]"

        class="w-50 h-100 bg-transparent absolute -top-[50rem] border-l-[25rem] border-l-transparent border-r-[25rem] border-r-transparent border-r-red-500 border-b-[50rem] border-b-solid border-b-red-500"
      ></div>
